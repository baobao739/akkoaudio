<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · AkkoMusic</title>
<style>
:root {
  --bg: #050506;
  --text: #f4f4f5;
  --muted: #8b8b96;
  --line: rgba(255,255,255,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
.grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at 50% 30%, black 15%, transparent 75%);
}
.shell {
  position: relative; z-index: 1;
  width: min(920px, 100%);
  margin: 0 auto;
  padding: 2.5rem 1.25rem 4rem;
}
.logo {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 1.05rem; font-weight: 600; letter-spacing: -0.04em;
  margin-bottom: 2.5rem; opacity: 0.9;
}
.logo span { font-weight: 700; }
.eyebrow {
  font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; margin-bottom: 0.75rem;
}
.h {
  font-size: clamp(2rem, 5vw, 2.75rem);
  font-weight: 500; letter-spacing: -0.04em; margin-bottom: 0.4rem;
}
.sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.75rem; max-width: 36rem; }

.login-wrap {
  min-height: 80vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
}
.login-form { width: min(360px, 100%); text-align: left; margin-top: 0.5rem; }
.label {
  display: block; margin: 0 0 2px; color: #71717a; font-size: 0.7rem;
  font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
}
.field {
  width: 100%; margin-bottom: 14px; padding: 14px 0;
  border: 0; border-bottom: 1px solid rgba(255,255,255,0.12);
  border-radius: 0; outline: none; background: transparent;
  color: var(--text); font-size: 1.05rem; font-family: inherit;
}
.field:focus { border-bottom-color: #f4f4f5; }
.field::placeholder { color: #52525b; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 46px; padding: 0 1.4rem; border: 0; border-radius: 999px;
  cursor: pointer; font-size: 0.95rem; font-weight: 600; font-family: inherit;
  transition: transform 0.12s ease, opacity 0.2s;
}
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary {
  background: #f4f4f5; color: #0a0a0b;
  box-shadow: 0 4px 0 #a1a1aa, 0 10px 28px rgba(0,0,0,0.35);
}
.btn-ghost {
  background: transparent; color: var(--text);
  border: 1px solid rgba(255,255,255,0.16);
}
.btn-danger {
  background: transparent; color: #ff929f;
  border: 1px solid rgba(255,92,108,0.35);
}
.btn-success {
  background: transparent; color: #8ef0b8;
  border: 1px solid rgba(102,227,154,0.35);
}
.btn-block { width: 100%; margin-top: 1.25rem; height: 50px; font-size: 1.05rem; }

.error { color: #ff6b6b; font-size: 13px; font-weight: 600; margin-top: 12px; min-height: 18px; text-align: center; }
.ok { color: #66e39a; font-size: 13px; font-weight: 600; margin-top: 12px; min-height: 18px; }

.top {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 16px; flex-wrap: wrap; margin-bottom: 1.75rem;
}
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.note {
  margin: 0 0 1.5rem; padding: 0 0 1.25rem;
  border-bottom: 1px solid var(--line);
  color: var(--muted); font-size: 0.9rem; line-height: 1.6;
}

.section {
  margin: 2rem 0 0;
  padding-top: 1.5rem;
  border-top: 1px solid var(--line);
}
.section-title {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--muted); margin: 0 0 1rem;
}

.stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  margin: 0 0 0.5rem;
}
.stat {
  padding: 1rem 0;
  border-bottom: 1px solid var(--line);
}
.stat b { display: block; font-size: 1.75rem; font-weight: 500; letter-spacing: -0.03em; }
.stat span {
  font-size: 0.65rem; letter-spacing: 0.14em; color: var(--muted);
  font-weight: 600; text-transform: uppercase;
}

.create-row {
  display: grid; grid-template-columns: 1fr 72px 72px auto;
  gap: 10px; align-items: end; margin-bottom: 8px;
}
.create-row-2 {
  display: grid; grid-template-columns: 1fr 1fr auto;
  gap: 10px; align-items: end; margin-bottom: 8px;
}
.create-row .field, .create-row-2 .field { margin-bottom: 0; }

.list { display: flex; flex-direction: column; gap: 0; }
.row {
  display: flex; justify-content: space-between; gap: 14px;
  align-items: flex-start; padding: 1.1rem 0;
  border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.row .name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
.row .detail { color: var(--muted); font-size: 0.8rem; line-height: 1.5; word-break: break-word; }
.row .creds {
  margin-top: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.8rem; color: #d4d4d8;
}
.row .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.row .btns .btn { height: 34px; padding: 0 12px; font-size: 0.8rem; }

.empty { color: var(--muted); font-size: 0.9rem; padding: 0.5rem 0 1rem; }

@media (max-width: 720px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .create-row, .create-row-2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="grid"></div>
<div class="shell" id="app"></div>
<script>
const app = document.getElementById("app");

function fmt(ts) {
  if (!ts) return "—";
  try { return new Date(ts).toLocaleString(); } catch { return String(ts); }
}

function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&")
    .replace(/</g, "<")
    .replace(/>/g, ">")
    .replace(/"/g, """);
}

function isAuthedAccountsResponse(res, data) {
  if (!res || res.status !== 200 || !data || data.ok !== true) return false;
  if (data.pending == null) data.pending = [];
  if (data.approved == null) data.approved = [];
  if (data.denied == null) data.denied = [];
  if (data.revoked == null) data.revoked = [];
  return Array.isArray(data.pending) && Array.isArray(data.approved);
}

function logoHtml() {
  return `<div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/>
      <circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
      <circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>
    </svg>
    Akko<span>Music</span>
  </div>`;
}

function login(message) {
  app.innerHTML = `
    <div class="login-wrap">
      ${logoHtml()}
      <div class="eyebrow">Admin</div>
      <h1 class="h">Sign in</h1>
      <p class="sub" style="text-align:center">Use ADMIN_PASSWORD from Netlify env.</p>
      <form class="login-form" id="loginForm" autocomplete="off">
        <label class="label" for="password">Password</label>
        <input class="field" id="password" type="password" placeholder=" " autofocus>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        <div class="error" id="error">${message ? escapeHtml(message) : ""}</div>
      </form>
    </div>`;

  document.getElementById("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const err = document.getElementById("error");
    err.textContent = "";
    const password = document.getElementById("password").value;
    document.getElementById("password").value = "";
    const btn = e.target.querySelector("button");
    btn.disabled = true;
    btn.textContent = "Signing in…";
    try {
      const r = await fetch("/.netlify/functions/admin-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ password })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) {
        err.textContent = d.error || "Login failed.";
        btn.disabled = false;
        btn.textContent = "Sign in";
        return;
      }
      await new Promise((r) => setTimeout(r, 150));
      dashboard();
    } catch {
      err.textContent = "Network error.";
      btn.disabled = false;
      btn.textContent = "Sign in";
    }
  };
}

async function fetchAccounts() {
  try {
    const r = await fetch("/.netlify/functions/list-accounts", {
      cache: "no-store",
      credentials: "include"
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) return { authed: false, data: null, reason: "expired" };
    if (r.status >= 500) {
      return {
        authed: true,
        data: { ok: true, pending: [], approved: [], denied: [], revoked: [] },
        serverError: (data && data.error) || "Server error loading accounts."
      };
    }
    if (!isAuthedAccountsResponse(r, data)) {
      return {
        authed: true,
        data: { ok: true, pending: [], approved: [], denied: [], revoked: [] },
        serverError: (data && data.error) || "Could not load accounts."
      };
    }
    return { authed: true, data };
  } catch {
    return {
      authed: true,
      data: { ok: true, pending: [], approved: [], denied: [], revoked: [] },
      serverError: "Network error loading accounts."
    };
  }
}

async function fetchReferrals() {
  try {
    const r = await fetch("/.netlify/functions/list-referrals", {
      cache: "no-store",
      credentials: "include"
    });
    if (r.status === 401) return null;
    const d = await r.json().catch(() => ({}));
    return d.codes || [];
  } catch {
    return [];
  }
}

function renderRow(row) {
  let buttons = "";
  if (row.status === "pending") {
    buttons = `<button class="btn btn-success" data-act="approve">Approve</button><button class="btn btn-danger" data-act="deny">Deny</button>`;
  } else if (row.status === "approved") {
    buttons = `<button class="btn btn-danger" data-act="revoke">Revoke</button>`;
  } else {
    buttons = `<button class="btn btn-success" data-act="approve">Re-approve</button>`;
  }
  buttons += `<button class="btn btn-danger" data-act="delete">Delete</button>`;
  const pass = row.password_plain ? escapeHtml(row.password_plain) : "(not stored)";
  return `<div class="row" data-id="${escapeHtml(row.id)}">
    <div style="flex:1;min-width:0">
      <div class="name">${escapeHtml(row.display_name || "—")} <span style="color:#71717a;font-weight:500;font-size:12px">· ${escapeHtml(row.status)}</span></div>
      <div class="detail">
        Code: ${escapeHtml(row.referral_code || "—")} · Created ${fmt(row.created_at)}
        ${row.last_login_at ? " · Last login " + fmt(row.last_login_at) : ""}
      </div>
      <div class="creds">user: <b>${escapeHtml(row.username)}</b> &nbsp; pass: <b>${pass}</b></div>
    </div>
    <div class="btns">${buttons}</div>
  </div>`;
}

function renderCode(c) {
  const left = Math.max(0, (c.max_uses || 1) - (c.use_count || 0));
  const used = left === 0;
  return `<div class="row">
    <div>
      <div class="name" style="font-family:ui-monospace,monospace;letter-spacing:0.12em">${escapeHtml(c.code)}</div>
      <div class="detail">${escapeHtml(c.label || "No label")} · uses ${c.use_count}/${c.max_uses} · ${used ? "USED UP" : left + " left"} · ${fmt(c.created_at)}</div>
    </div>
    <div class="btns"><button class="btn btn-ghost" data-copy="${escapeHtml(c.code)}">Copy</button></div>
  </div>`;
}

async function logout() {
  try {
    await fetch("/.netlify/functions/admin-logout", { method: "POST", credentials: "include" });
  } catch {}
  login("Signed out.");
}

async function dashboard() {
  app.innerHTML = `
    ${logoHtml()}
    <div class="top">
      <div>
        <div class="eyebrow">Admin</div>
        <h1 class="h">Whitelist + referrals</h1>
        <p class="sub">Generate codes → users sign up → you see name, username, password.</p>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="refresh" type="button">Refresh</button>
        <button class="btn btn-ghost" id="logout" type="button">Log out</button>
      </div>
    </div>

    <p class="note">1. Create referral codes. 2. Give one code per person. 3. They sign up with code + name + username + password. 4. Refresh to see their info.</p>

    <div class="section-title">Generate referral codes</div>
    <div class="create-row">
      <div>
        <label class="label" for="refLabel">Label</label>
        <input class="field" id="refLabel" placeholder="e.g. Room 12">
      </div>
      <div>
        <label class="label" for="refCount">Count</label>
        <input class="field" id="refCount" type="number" min="1" max="50" value="1">
      </div>
      <div>
        <label class="label" for="refMax">Uses</label>
        <input class="field" id="refMax" type="number" min="1" max="500" value="1">
      </div>
      <button class="btn btn-primary" id="genRef" type="button">Generate</button>
    </div>
    <div class="error" id="refErr" style="text-align:left"></div>
    <div class="ok" id="refOk"></div>

    <div class="section-title" style="margin-top:2rem">Or create account yourself</div>
    <div class="create-row-2">
      <div>
        <label class="label" for="newUser">Username</label>
        <input class="field" id="newUser" maxlength="32" placeholder=" ">
      </div>
      <div>
        <label class="label" for="newPass">Password</label>
        <input class="field" id="newPass" type="password" maxlength="128" placeholder=" ">
      </div>
      <button class="btn btn-primary" id="createBtn" type="button">Create</button>
    </div>
    <div class="error" id="createErr" style="text-align:left"></div>
    <div class="ok" id="createOk"></div>

    <div id="content" style="margin-top:1rem"><p class="empty">Loading…</p></div>`;

  document.getElementById("refresh").onclick = () => refresh();
  document.getElementById("logout").onclick = () => logout();

  document.getElementById("genRef").onclick = async () => {
    const err = document.getElementById("refErr");
    const ok = document.getElementById("refOk");
    err.textContent = "";
    ok.textContent = "";
    const label = document.getElementById("refLabel").value.trim();
    const count = Number(document.getElementById("refCount").value || 1);
    const max_uses = Number(document.getElementById("refMax").value || 1);
    const btn = document.getElementById("genRef");
    btn.disabled = true;
    try {
      const r = await fetch("/.netlify/functions/admin-create-referral", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ label, count, max_uses })
      });
      const d = await r.json().catch(() => ({}));
      if (r.status === 401) { login("Session expired."); return; }
      if (!r.ok) { err.textContent = d.error || "Failed"; btn.disabled = false; return; }
      const codes = (d.codes || []).map((c) => c.code).join(", ");
      ok.textContent = "Created: " + codes;
      btn.disabled = false;
      refresh();
    } catch {
      err.textContent = "Network error";
      btn.disabled = false;
    }
  };

  document.getElementById("createBtn").onclick = async () => {
    const err = document.getElementById("createErr");
    const ok = document.getElementById("createOk");
    err.textContent = "";
    ok.textContent = "";
    const username = document.getElementById("newUser").value.trim();
    const password = document.getElementById("newPass").value;
    const btn = document.getElementById("createBtn");
    btn.disabled = true;
    try {
      const r = await fetch("/.netlify/functions/admin-create-account", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ username, password, status: "approved" })
      });
      const d = await r.json().catch(() => ({}));
      if (r.status === 401) { login("Session expired."); return; }
      if (!r.ok) { err.textContent = d.error || "Failed"; btn.disabled = false; return; }
      ok.textContent = "Created " + (d.account && d.account.username);
      document.getElementById("newUser").value = "";
      document.getElementById("newPass").value = "";
      btn.disabled = false;
      refresh();
    } catch {
      err.textContent = "Network error";
      btn.disabled = false;
    }
  };

  await refresh();
}

async function refresh() {
  const content = document.getElementById("content");
  if (!content) return;
  content.innerHTML = `<p class="empty">Loading…</p>`;
  const result = await fetchAccounts();
  if (!result.authed) {
    login(result.reason === "expired" ? "Session expired." : "Not signed in.");
    return;
  }
  const codes = await fetchReferrals();
  const data = result.data;
  const pending = data.pending || [];
  const approved = data.approved || [];
  const denied = data.denied || [];
  const revoked = data.revoked || [];
  const all = [...approved, ...pending, ...denied, ...revoked];
  const errBanner = result.serverError
    ? `<div class="error" style="text-align:left;margin-bottom:12px">${escapeHtml(result.serverError)} (still signed in)</div>`
    : "";

  content.innerHTML = `
    ${errBanner}
    <div class="stats">
      <div class="stat"><b>${approved.length}</b><span>Approved</span></div>
      <div class="stat"><b>${pending.length}</b><span>Pending</span></div>
      <div class="stat"><b>${(codes || []).filter((c) => c.use_count < c.max_uses).length}</b><span>Open codes</span></div>
      <div class="stat"><b>${(codes || []).length}</b><span>All codes</span></div>
    </div>

    <div class="section">
      <div class="section-title">Referral codes</div>
      <div class="list">${(codes || []).length ? codes.map(renderCode).join("") : `<p class="empty">None yet — generate above.</p>`}</div>
    </div>

    <div class="section">
      <div class="section-title">Users</div>
      <div class="list">${all.length ? all.map(renderRow).join("") : `<p class="empty">No users yet.</p>`}</div>
    </div>`;

  content.querySelectorAll("[data-copy]").forEach((btn) => {
    btn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        btn.textContent = "Copied";
        setTimeout(() => (btn.textContent = "Copy"), 1000);
      } catch {}
    };
  });

  content.querySelectorAll("[data-act]").forEach((btn) => {
    btn.onclick = async () => {
      const id = btn.closest(".row").dataset.id;
      const action = btn.dataset.act;
      if (action === "revoke" && !confirm("Revoke this account?")) return;
      if (action === "delete" && !confirm("Permanently delete? Removed from list.")) return;
      btn.disabled = true;
      try {
        const r = await fetch("/.netlify/functions/review-account", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ id, action })
        });
        const d = await r.json().catch(() => ({}));
        if (r.status === 401) { login("Session expired."); return; }
        if (!r.ok) { alert(d.error || "Failed"); btn.disabled = false; return; }
        refresh();
      } catch {
        alert("Network error");
        btn.disabled = false;
      }
    };
  });
}

(async () => {
  app.innerHTML = `<div class="login-wrap">${logoHtml()}<p class="sub" style="text-align:center">Checking session…</p></div>`;
  const result = await fetchAccounts();
  if (result.authed) dashboard();
  else login("");
})();
</script>
</body>
</html>
