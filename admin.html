<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:Inter,system-ui,sans-serif;color:#f5f5f7}
body{min-height:100vh;background:radial-gradient(circle at 15% 5%,#7b8cff3d,transparent 35%),radial-gradient(circle at 90% 90%,#7b8cff24,transparent 35%),linear-gradient(180deg,#252631,#15161d);padding:28px}
.glass{background:#ffffff0d;border:1px solid #ffffff1a;backdrop-filter:blur(35px);box-shadow:0 25px 70px #0007}
.shell{width:min(980px,100%);margin:auto}
.brand{font-size:13px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:#bfc6ff;margin:0 0 14px 5px}
.card{border-radius:28px;padding:34px}
.login{width:min(440px,100%);margin:10vh auto}
.h{font-size:32px;letter-spacing:-1.2px;margin-bottom:8px}
.sub{color:#aaaab8;font-size:13px;line-height:1.6;margin-bottom:18px}
.input{width:100%;height:48px;border-radius:14px;border:1px solid #ffffff18;background:#ffffff0b;color:#fff;outline:0;padding:0 14px;font-size:14px;margin-bottom:10px}
.btn{height:42px;border:0;border-radius:12px;background:#7b8cff;color:#10111a;font-weight:700;padding:0 14px;cursor:pointer;font-size:13px}
.btn.secondary{background:#ffffff0b;color:#fff;border:1px solid #ffffff16}
.btn.danger{background:#ff5c6c22;color:#ff929f;border:1px solid #ff5c6c44}
.btn.success{background:#66e39a22;color:#8ef0b8;border:1px solid #66e39a44}
.btn:disabled{opacity:.5;cursor:not-allowed}
.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.error{color:#ff9aa6;font-size:13px;font-weight:600;margin-top:6px;min-height:18px}
.ok{color:#8ef0b8;font-size:13px;font-weight:600;margin-top:6px;min-height:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 20px}
.stat{padding:14px;border-radius:14px;background:#ffffff08;border:1px solid #ffffff12}
.stat b{display:block;font-size:22px}
.stat span{font-size:10px;letter-spacing:1px;color:#aaaab8;font-weight:700}
.section-title{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#bfc6ff;margin:20px 0 10px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:#ffffff08;border:1px solid #ffffff12;flex-wrap:wrap}
.row .name{font-weight:700;font-size:14px;margin-bottom:4px}
.row .detail{color:#aaaab8;font-size:12px;line-height:1.5;word-break:break-word}
.row .creds{margin-top:6px;padding:8px 10px;border-radius:10px;background:#00000040;font-family:ui-monospace,monospace;font-size:12px;color:#d7dbff}
.row .btns{display:flex;gap:6px;flex-wrap:wrap}
.note{margin:0 0 14px;padding:12px;border-radius:12px;background:#7b8cff18;border:1px solid #7b8cff44;color:#c5cbff;font-size:12px;line-height:1.5}
.create{margin:0 0 16px;padding:14px;border-radius:14px;background:#ffffff08;border:1px solid #ffffff14}
.create .row-inputs{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.ref-row{display:grid;grid-template-columns:1fr 80px 80px auto;gap:8px;align-items:center;margin-bottom:8px}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.create .row-inputs,.ref-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<script>
const app = document.getElementById("app");
function fmt(ts) {
  if (!ts) return "—";
  try { return new Date(ts).toLocaleString(); } catch { return ts; }
}
function escapeHtml(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function isAuthedAccountsResponse(res, data) {
  return res && res.ok && res.status === 200 && data && data.ok === true && Array.isArray(data.pending) && Array.isArray(data.approved);
}
function login(message) {
  app.innerHTML = `
    <section class="card glass login">
      <div class="brand">ADMIN</div>
      <h1 class="h">Sign in</h1>
      <p class="sub">Use ADMIN_PASSWORD from Netlify env.</p>
      <form id="loginForm" autocomplete="off">
        <input class="input" id="password" type="password" placeholder="Admin password">
        <button class="btn" style="width:100%;height:48px" type="submit">Sign in</button>
        <div class="error" id="error">${message ? escapeHtml(message) : ""}</div>
      </form>
    </section>`;
  document.getElementById("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const err = document.getElementById("error");
    err.textContent = "";
    const password = document.getElementById("password").value;
    document.getElementById("password").value = "";
    const btn = e.target.querySelector("button");
    btn.disabled = true;
    btn.textContent = "Signing in…";
    try {
      const r = await fetch("/.netlify/functions/admin-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ password })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) {
        err.textContent = d.error || "Login failed.";
        btn.disabled = false;
        btn.textContent = "Sign in";
        return;
      }
      dashboard();
    } catch {
      err.textContent = "Network error.";
      btn.disabled = false;
      btn.textContent = "Sign in";
    }
  };
}
async function fetchAccounts() {
  try {
    const r = await fetch("/.netlify/functions/list-accounts", { cache: "no-store", credentials: "include" });
    const data = await r.json().catch(() => null);
    if (r.status === 401) return { authed: false, data: null };
    if (!isAuthedAccountsResponse(r, data)) return { authed: false, data: null, broken: true };
    return { authed: true, data };
  } catch {
    return { authed: false, data: null, broken: true };
  }
}
async function fetchReferrals() {
  try {
    const r = await fetch("/.netlify/functions/list-referrals", { cache: "no-store", credentials: "include" });
    if (r.status === 401) return null;
    const d = await r.json().catch(() => ({}));
    return d.codes || [];
  } catch {
    return [];
  }
}
function renderRow(row) {
  let buttons = "";
  if (row.status === "pending") {
    buttons = `<button class="btn success" data-act="approve">Approve</button><button class="btn danger" data-act="deny">Deny</button>`;
  } else if (row.status === "approved") {
    buttons = `<button class="btn danger" data-act="revoke">Revoke</button>`;
  } else {
    buttons = `<button class="btn success" data-act="approve">Re-approve</button>`;
  }
  buttons += `<button class="btn danger" data-act="delete">Delete</button>`;
  const pass = row.password_plain ? escapeHtml(row.password_plain) : "(not stored)";
  return `<div class="row" data-id="${escapeHtml(row.id)}">
    <div class="meta" style="flex:1;min-width:0">
      <div class="name">${escapeHtml(row.display_name || "—")} <span style="color:#888;font-weight:500;font-size:12px">· ${escapeHtml(row.status)}</span></div>
      <div class="detail">
        Code: ${escapeHtml(row.referral_code || "—")} · Created ${fmt(row.created_at)}
        ${row.last_login_at ? " · Last login " + fmt(row.last_login_at) : ""}
      </div>
      <div class="creds">user: <b>${escapeHtml(row.username)}</b> &nbsp; pass: <b>${pass}</b></div>
    </div>
    <div class="btns">${buttons}</div>
  </div>`;
}
function renderCode(c) {
  const left = Math.max(0, (c.max_uses || 1) - (c.use_count || 0));
  const used = left === 0;
  return `<div class="row">
    <div class="meta">
      <div class="name" style="font-family:monospace;letter-spacing:2px">${escapeHtml(c.code)}</div>
      <div class="detail">${escapeHtml(c.label || "No label")} · uses ${c.use_count}/${c.max_uses} · ${used ? "USED UP" : left + " left"} · ${fmt(c.created_at)}</div>
    </div>
    <div class="btns"><button class="btn secondary" data-copy="${escapeHtml(c.code)}">Copy</button></div>
  </div>`;
}
async function logout() {
  try { await fetch("/.netlify/functions/admin-logout", { method: "POST", credentials: "include" }); } catch {}
  login("Signed out.");
}
async function dashboard() {
  app.innerHTML = `
    <section class="card glass">
      <div class="top">
        <div>
          <div class="brand">ADMIN</div>
          <h1 class="h">Whitelist + referrals</h1>
          <p class="sub">Generate codes → users sign up → you see name, username, password.</p>
        </div>
        <div class="actions">
          <button class="btn secondary" id="refresh">Refresh</button>
          <button class="btn secondary" id="logout">Log out</button>
        </div>
      </div>

      <div class="note">1. Create referral codes below. 2. Give one code per person/Chromebook. 3. They Sign up with code + name + username + password. 4. Refresh to see their info. Delete removes them from the list.</div>

      <div class="create">
        <div class="section-title" style="margin-top:0">Generate referral codes</div>
        <div class="ref-row">
          <input class="input" id="refLabel" placeholder="Label (e.g. Room 12)" style="margin:0;height:42px">
          <input class="input" id="refCount" type="number" min="1" max="50" value="1" title="How many codes" style="margin:0;height:42px">
          <input class="input" id="refMax" type="number" min="1" max="500" value="1" title="Uses per code" style="margin:0;height:42px">
          <button class="btn success" id="genRef" type="button">Generate</button>
        </div>
        <div class="error" id="refErr"></div>
        <div class="ok" id="refOk"></div>
      </div>

      <div class="create">
        <div class="section-title" style="margin-top:0">Or create account yourself</div>
        <div class="row-inputs">
          <input class="input" id="newUser" placeholder="username" maxlength="32" style="margin:0;height:42px">
          <input class="input" id="newPass" type="password" placeholder="password" maxlength="128" style="margin:0;height:42px">
          <button class="btn success" id="createBtn" type="button">Create</button>
        </div>
        <div class="error" id="createErr"></div>
        <div class="ok" id="createOk"></div>
      </div>

      <div id="content"><p class="sub">Loading…</p></div>
    </section>`;

  document.getElementById("refresh").onclick = () => refresh();
  document.getElementById("logout").onclick = () => logout();

  document.getElementById("genRef").onclick = async () => {
    const err = document.getElementById("refErr");
    const ok = document.getElementById("refOk");
    err.textContent = "";
    ok.textContent = "";
    const label = document.getElementById("refLabel").value.trim();
    const count = Number(document.getElementById("refCount").value || 1);
    const max_uses = Number(document.getElementById("refMax").value || 1);
    const btn = document.getElementById("genRef");
    btn.disabled = true;
    try {
      const r = await fetch("/.netlify/functions/admin-create-referral", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ label, count, max_uses })
      });
      const d = await r.json().catch(() => ({}));
      if (r.status === 401) { login("Session expired."); return; }
      if (!r.ok) { err.textContent = d.error || "Failed"; btn.disabled = false; return; }
      const codes = (d.codes || []).map((c) => c.code).join(", ");
      ok.textContent = "Created: " + codes;
      btn.disabled = false;
      refresh();
    } catch {
      err.textContent = "Network error";
      btn.disabled = false;
    }
  };

  document.getElementById("createBtn").onclick = async () => {
    const err = document.getElementById("createErr");
    const ok = document.getElementById("createOk");
    err.textContent = "";
    ok.textContent = "";
    const username = document.getElementById("newUser").value.trim();
    const password = document.getElementById("newPass").value;
    const btn = document.getElementById("createBtn");
    btn.disabled = true;
    try {
      const r = await fetch("/.netlify/functions/admin-create-account", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ username, password, status: "approved" })
      });
      const d = await r.json().catch(() => ({}));
      if (r.status === 401) { login("Session expired."); return; }
      if (!r.ok) { err.textContent = d.error || "Failed"; btn.disabled = false; return; }
      ok.textContent = "Created " + (d.account && d.account.username);
      document.getElementById("newUser").value = "";
      document.getElementById("newPass").value = "";
      btn.disabled = false;
      refresh();
    } catch {
      err.textContent = "Network error";
      btn.disabled = false;
    }
  };

  await refresh();
}

async function refresh() {
  const content = document.getElementById("content");
  if (!content) return;
  content.innerHTML = `<p class="sub">Loading…</p>`;
  const result = await fetchAccounts();
  if (!result.authed) {
    login(result.broken ? "Session invalid." : "Session expired.");
    return;
  }
  const codes = await fetchReferrals();
  const data = result.data;
  const pending = data.pending || [];
  const approved = data.approved || [];
  const denied = data.denied || [];
  const revoked = data.revoked || [];
  const all = [...approved, ...pending, ...denied, ...revoked];

  content.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${approved.length}</b><span>APPROVED</span></div>
      <div class="stat"><b>${pending.length}</b><span>PENDING</span></div>
      <div class="stat"><b>${(codes || []).filter(c => c.use_count < c.max_uses).length}</b><span>OPEN CODES</span></div>
      <div class="stat"><b>${(codes || []).length}</b><span>ALL CODES</span></div>
    </div>

    <div class="section-title">Referral codes</div>
    <div class="list">${(codes || []).length ? codes.map(renderCode).join("") : `<div class="detail" style="padding:8px">None yet — generate above.</div>`}</div>

    <div class="section-title">Users (name · username · password)</div>
    <div class="list">${all.length ? all.map(renderRow).join("") : `<div class="detail" style="padding:8px">No users yet.</div>`}</div>`;

  content.querySelectorAll("[data-copy]").forEach((btn) => {
    btn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        btn.textContent = "Copied";
        setTimeout(() => (btn.textContent = "Copy"), 1000);
      } catch {}
    };
  });

  content.querySelectorAll("[data-act]").forEach((btn) => {
    btn.onclick = async () => {
      const id = btn.closest(".row").dataset.id;
      const action = btn.dataset.act;
      if (action === "revoke" && !confirm("Revoke this account?")) return;
      if (action === "delete" && !confirm("Permanently delete? Removed from list.")) return;
      btn.disabled = true;
      try {
        const r = await fetch("/.netlify/functions/review-account", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ id, action })
        });
        const d = await r.json().catch(() => ({}));
        if (r.status === 401) { login("Session expired."); return; }
        if (!r.ok) { alert(d.error || "Failed"); btn.disabled = false; return; }
        refresh();
      } catch {
        alert("Network error");
        btn.disabled = false;
      }
    };
  });
}

(async () => {
  app.innerHTML = `<section class="card glass login"><p class="sub">Checking session…</p></section>`;
  const result = await fetchAccounts();
  if (result.authed) dashboard();
  else login("");
})();
</script>
</body>
</html>
