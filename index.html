<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0a0a12">
<title>AkkoAudio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   AKKOAUDIO — VIBRANT SPATIAL GLASS
   Rich color, deep glass, theme-aware surfaces, fluid scale
   ========================================================= */

@property --accent {
    syntax: "<color>";
    inherits: true;
    initial-value: #7b8cff;
}

@property --accent-bright {
    syntax: "<color>";
    inherits: true;
    initial-value: #a8b4ff;
}

@property --accent-soft {
    syntax: "<color>";
    inherits: true;
    initial-value: rgba(123, 140, 255, 0.28);
}

@property --accent-glow {
    syntax: "<color>";
    inherits: true;
    initial-value: rgba(123, 140, 255, 0.55);
}

:root {
    --bg: #0e0f18;
    --bg-deep: #08090f;
    --surface: color-mix(in srgb, var(--accent) 14%, rgba(255, 255, 255, 0.08));
    --surface-2: color-mix(in srgb, var(--accent) 18%, rgba(255, 255, 255, 0.11));
    --surface-3: color-mix(in srgb, var(--accent) 24%, rgba(255, 255, 255, 0.16));

    --accent: #7b8cff;
    --accent-bright: #a8b4ff;
    --accent-soft: rgba(123, 140, 255, 0.28);
    --accent-glow: rgba(123, 140, 255, 0.55);

    --text: #f7f7fb;
    --text-soft: #d4d4e4;
    --muted: #a4a4bc;
    --muted-2: #787890;

    --glass-border: color-mix(in srgb, var(--accent) 28%, rgba(255, 255, 255, 0.14));
    --glass-border-strong: color-mix(in srgb, var(--accent) 42%, rgba(255, 255, 255, 0.22));
    --glass-highlight: rgba(255, 255, 255, 0.18);
    --glass-shadow:
        0 14px 44px rgba(0, 0, 0, 0.42),
        0 3px 12px rgba(0, 0, 0, 0.26),
        inset 0 1px 0 var(--glass-highlight);
    --floating-shadow:
        0 32px 80px rgba(0, 0, 0, 0.48),
        0 10px 28px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 var(--glass-highlight),
        0 0 40px color-mix(in srgb, var(--accent) 12%, transparent);

    --shell-inset: clamp(10px, 1.6vw, 20px);
    --shell-gap: clamp(12px, 1.8vw, 24px);
    --radius-xs: 10px;
    --radius-sm: 14px;
    --radius: 20px;
    --radius-lg: 28px;
    --radius-xl: 36px;

    --sidebar-width: clamp(204px, 18vw, 252px);
    --player-height: 64px;
    --mobile-nav-height: 64px;

    --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

    --theme-top: #2e3040;
    --theme-mid: #1e2030;
    --theme-bottom: #12141e;
    --theme-bloom: rgba(123, 140, 255, 0.22);
    --theme-side-top: rgba(72, 74, 92, 0.88);
    --theme-side-bottom: rgba(42, 44, 58, 0.86);
    --theme-panel: rgba(58, 60, 76, 0.92);
    --theme-queue: rgba(62, 64, 80, 0.95);
    --theme-focus: #1a1c28;
    --theme-topbar: color-mix(in srgb, var(--accent) 16%, rgba(40, 42, 56, 0.72));

    color-scheme: dark;

    transition:
        --accent 0.5s var(--ease),
        --accent-bright 0.5s var(--ease),
        --accent-soft 0.5s var(--ease),
        --accent-glow 0.5s var(--ease);
}

html {
    width: 100%;
    min-height: 100%;
    background: var(--bg-deep);
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

html * {
    transition-property: background-color, color, border-color, box-shadow, fill, stroke, text-shadow, backdrop-filter, transform, opacity;
    transition-duration: 0.38s;
    transition-timing-function: var(--ease);
}

html button,
html .song-card,
html .control,
html .full-control,
html .nav-button,
html input[type="range"] {
    transition-property: background-color, color, border-color, box-shadow, transform, opacity, backdrop-filter;
}

.control,
.full-control,
.nav-button,
.like-btn,
.full-like,
.full-back,
.shuffle-btn,
.play-overlay,
.queue-add-btn,
.track-row-like {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background:
        radial-gradient(ellipse 80% 55% at 85% -5%, color-mix(in srgb, var(--accent) 38%, transparent), transparent 55%),
        radial-gradient(ellipse 60% 45% at 5% 95%, var(--theme-bloom), transparent 50%),
        radial-gradient(ellipse 50% 40% at 50% 40%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%),
        linear-gradient(165deg, var(--theme-top) 0%, var(--theme-mid) 45%, var(--theme-bottom) 100%);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    isolation: isolate;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
    background: none;
}

img {
    user-select: none;
    -webkit-user-drag: none;
    max-width: 100%;
}

.hidden {
    display: none !important;
}

body::before,
body::after {
    content: "";
    position: fixed;
    z-index: 0;
    pointer-events: none;
    border-radius: 50%;
    filter: blur(48px);
}

body::before {
    width: min(75vw, 980px);
    height: min(75vw, 980px);
    top: -34vw;
    right: -22vw;
    background:
        radial-gradient(circle at 32% 38%, color-mix(in srgb, var(--accent) 48%, transparent), transparent 50%),
        radial-gradient(circle at 70% 70%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 55%);
    opacity: 0.55;
}

body::after {
    width: min(55vw, 640px);
    height: min(55vw, 640px);
    bottom: -28vw;
    left: -18vw;
    background: radial-gradient(circle at 40% 40%, color-mix(in srgb, var(--accent) 32%, transparent), transparent 60%);
    opacity: 0.4;
}
