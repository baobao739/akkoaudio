<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AkkoMusic</title>
<script>
(async function () {
  try {
    const res = await fetch("/.netlify/functions/verify-session", {
      method: "GET", credentials: "include", cache: "no-store"
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.valid && data.unlocked) {
      location.replace("/home");
      return;
    }
  } catch (_) {}
})();
</script>
<style>
:root {
  --bg: #050506;
  --text: #f4f4f5;
  --muted: #8b8b96;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow-x: hidden;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
}
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; justify-content: center; padding: 1.75rem 1.5rem;
  pointer-events: none;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 1.05rem; font-weight: 600; letter-spacing: -0.04em;
  color: var(--text); opacity: 0.9;
}
.logo span { font-weight: 700; }
.hero {
  position: relative; z-index: 2;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 6rem 1.5rem 4rem;
}
.eyebrow {
  font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 1.25rem; font-weight: 600;
}
.hero h1 {
  font-size: clamp(2.75rem, 9vw, 5.5rem);
  font-weight: 500; letter-spacing: -0.045em; line-height: 1.05;
  max-width: 14ch;
}
.hero p {
  margin-top: 1.25rem; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.15rem);
  max-width: 28rem; font-weight: 400;
}
.scroll-hint {
  margin-top: 3rem; color: var(--muted); font-size: 0.7rem;
  letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.65;
  animation: bob 2.4s ease-in-out infinite;
}
@keyframes bob {
  0%, 100% { transform: translateY(0); opacity: 0.4; }
  50% { transform: translateY(8px); opacity: 0.9; }
}
.gallery-container { position: relative; height: 280vh; width: 100%; z-index: 1; }
.scene {
  position: sticky; top: 0; height: 100vh; width: 100%;
  display: flex; justify-content: center; align-items: center;
  perspective: 1200px;
}
.sphere {
  width: min(70vw, 420px); height: min(70vw, 420px);
  position: relative; transform-style: preserve-3d;
}
.sphere img {
  position: absolute; width: 64px; height: 64px; object-fit: cover;
  border-radius: 12px; left: 50%; top: 50%;
  margin: -32px 0 0 -32px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.55);
  opacity: 0.92;
}
.floating-text {
  position: absolute; z-index: 3; max-width: 280px; pointer-events: none;
  opacity: 0;
}
.floating-text.left-text { left: 8%; top: 28%; }
.floating-text h2 {
  font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 500; letter-spacing: -0.03em;
  margin-bottom: 0.5rem;
}
.floating-text p { color: var(--muted); font-size: 0.9rem; }
.network-lines {
  position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
}
.enter {
  position: relative; z-index: 2;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 4rem 1.5rem 5rem;
  background: radial-gradient(ellipse at 50% 40%, #121214 0%, var(--bg) 65%);
}
.enter h2 {
  font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 500; letter-spacing: -0.04em;
  margin-bottom: 1rem;
}
.enter p {
  color: var(--muted); max-width: 22rem; margin-bottom: 2.5rem; font-size: 1rem;
}
.cta {
  display: flex; flex-wrap: wrap; gap: 0.85rem; justify-content: center;
}
.cta a {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 148px; padding: 0.95rem 1.75rem;
  border-radius: 999px; font-size: 1rem; font-weight: 600;
  text-decoration: none; transition: transform 0.15s ease, opacity 0.2s;
}
.cta a:active { transform: translateY(2px); }
.cta .primary {
  background: #f4f4f5; color: #0a0a0b;
  box-shadow: 0 4px 0 #a1a1aa, 0 8px 24px rgba(0,0,0,0.4);
}
.cta .ghost {
  background: transparent; color: #f4f4f5;
  border: 1px solid rgba(255,255,255,0.18);
}
.cta .ghost:hover { border-color: rgba(255,255,255,0.4); }
@media (max-width: 700px) {
  .floating-text.left-text { left: 5%; right: 5%; max-width: none; top: 12%; text-align: center; }
  .sphere img { width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 10px; }
}
</style>
</head>
<body>
<div class="grid"></div>
<nav class="nav">
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/>
      <circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
      <circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>
    </svg>
    Akko<span>Music</span>
  </div>
</nav>
<header class="hero">
  <div class="eyebrow">Private · Invite only</div>
  <h1>Your music. Your space.</h1>
  <p>Synced lyrics, covers, and a player built for late nights.</p>
  <div class="scroll-hint">Scroll</div>
</header>
<section class="gallery-container">
  <div class="floating-text left-text">
    <h2 id="dynamic-title">Late-night sessions</h2>
    <p id="dynamic-desc">Focus mode, lyrics, and the tracks that matter.</p>
  </div>
  <div class="scene"><div class="sphere" id="sphere"></div></div>
  <svg class="network-lines" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path d="M0,50 Q25,30 50,50 T100,50" stroke="rgba(255,255,255,0.04)" stroke-width="0.15" fill="none"/>
  </svg>
</section>
<section class="enter">
  <h2>Enter</h2>
  <p>Sign up with a referral code, or log in if you already have access.</p>
  <div class="cta">
    <a class="primary" href="/register">Sign up</a>
    <a class="ghost" href="/login">Log in</a>
  </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const COVER_POOL = ["covers/20min.jfif","covers/4raws.jpg","covers/aintinla.JPG","covers/backhome.jpg","covers/bakeshop.jfif","covers/circles.JPG","covers/congrats.JPG","covers/crown.JPG","covers/darkknightdummo.JPG","covers/darkthoughts.JPG","covers/drowning.JPG","covers/familyties.JPG","covers/fhc.JPG","covers/happier.JPG","covers/here.jfif","covers/hftw.JPG","covers/hotgirlbummer.jfif","covers/howdemo.JPG","covers/idxt.jfif","covers/jane.jpg","covers/kills.JPG","covers/leaveamsg.jfif","covers/leavemealone.JPG","covers/loverboy.jfif","covers/lvsandals.jpg","covers/madebyakko.jpg","covers/magnolia.JPG","covers/meanttobe.jfif","covers/misery.JPG","covers/murderonmymind.JPG","covers/nothemoon.jfif","covers/nothing.JPG","covers/nsiyw.JPG","covers/nuts.JPG","covers/onnothing.JPG","covers/phantom.jpg","covers/showyoume.JPG","covers/steady.JPG","covers/summerbummer.jfif","covers/thecure.JPG","covers/vbsxbp.jfif","covers/waf.JPG","covers/whiteferrari.jpg","covers/wi.JPG","covers/worldwide.JPG","covers/xotourllif3.jfif","covers/yellow.jpg"];
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
const sphere = document.getElementById("sphere");
const picks = shuffle(COVER_POOL).slice(0, 28);
picks.forEach((src, i) => {
  const img = document.createElement("img");
  img.src = "/" + src;
  img.alt = "";
  img.loading = "lazy";
  const phi = Math.acos(-1 + (2 * i) / picks.length);
  const theta = Math.sqrt(picks.length * Math.PI) * phi;
  const r = 160;
  const x = r * Math.cos(theta) * Math.sin(phi);
  const y = r * Math.sin(theta) * Math.sin(phi);
  const z = r * Math.cos(phi);
  img.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
  sphere.appendChild(img);
});
gsap.to(sphere, {
  rotationY: 360, rotationX: 40, ease: "none",
  scrollTrigger: { trigger: ".gallery-container", start: "top top", end: "bottom bottom", scrub: 1.2 }
});
gsap.fromTo(".floating-text", { opacity: 0, y: 30 }, {
  opacity: 1, y: 0,
  scrollTrigger: { trigger: ".gallery-container", start: "15% top", end: "40% top", scrub: true }
});
gsap.fromTo(".floating-text", { opacity: 1 }, {
  opacity: 0,
  scrollTrigger: { trigger: ".gallery-container", start: "55% top", end: "75% top", scrub: true }
});
const titles = [
  ["Late-night sessions", "Focus mode, lyrics, and the tracks that matter."],
  ["Your covers. Spinning.", "Every album art from the library — live on the sphere."],
  ["Invite only", "Referral code in. Then it's yours."]
];
let ti = 0;
ScrollTrigger.create({
  trigger: ".gallery-container", start: "top top", end: "bottom bottom", scrub: true,
  onUpdate(self) {
    const n = Math.min(titles.length - 1, Math.floor(self.progress * titles.length));
    if (n !== ti) {
      ti = n;
      document.getElementById("dynamic-title").textContent = titles[n][0];
      document.getElementById("dynamic-desc").textContent = titles[n][1];
    }
  }
});
</script>
</body>
</html>
